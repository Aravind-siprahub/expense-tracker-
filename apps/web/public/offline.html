<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>You're offline</title>
  <!--
    Shown by the service worker (sw.js) when a page cannot be loaded without a connection.
    It is deliberately plain HTML with inline styles and no app scripts: it is shown at whatever
    address the person asked for (for example /budget), so the app's own scripts must not run here.
  -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      background: #f5f8ff radial-gradient(900px 300px at 70% -80px, #dbeafe 0%, rgba(219, 234, 254, 0) 70%) no-repeat;
      color: #0f172a; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 380px; text-align: center; background: #fff; border: 1px solid rgba(226, 232, 240, 0.8);
      border-radius: 24px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px -14px rgba(37, 99, 235, .22);
    }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #eff6ff; color: #2563eb; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    p { margin: 8px 0 0; font-size: 14px; line-height: 22px; color: #64748b; }
    button {
      margin-top: 24px; width: 100%; padding: 12px 16px; border: 0; border-radius: 12px; background: #2563eb; color: #fff;
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Family Expense Tracker needs an internet connection to show your latest family data. Check your connection and try again.</p>
    <button type="button" id="retry">Try again</button>
  </main>
  <script>
    // Reload the page that was asked for as soon as the connection is back.
    document.getElementById('retry').addEventListener('click', function () { location.reload(); });
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
